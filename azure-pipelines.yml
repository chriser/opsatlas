trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    displayName: Checkout full history

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: Use Python 3.11

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.lock
    displayName: Install backend dependencies (pinned)

  # Known vulnerabilities in the pinned set, reported on every build; not yet a failure, so an advisory with no fix
  # cannot block delivery. Tighten to a failure once the first report is clean.
  - script: |
      pip install pip-audit
      pip-audit -r requirements.lock --desc
    displayName: Audit dependencies (report only)
    continueOnError: true

  - script: |
      ruff check .
    displayName: Lint (ruff)

  - script: |
      pytest
    displayName: Run backend tests

  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node 20

  - script: |
      node --test tests/test_sme*_browser.mjs
    displayName: Test interview playback and live transport

  - script: |
      cd frontend
      npm ci
      npm run build
    displayName: Build control-panel frontend

  - script: |
      node --test tests/test_sme_voice_client.mjs
    displayName: Test the control panel's Tibi client (start and end lifecycle)

  # ---------------------------------------------------------------------------
  # GitHub Mirror — keeps github.com/chriser/opsatlas in sync with ADO after a
  # successful build of a branch (never a pull request's merge ref), under the
  # branch's full name, so claude/x arrives as claude/x and broken code never
  # reaches the mirror (ARCH F3).
  #
  # Prerequisites:
  #   1. Create a GitHub PAT (scope: repo) at github.com/settings/tokens
  #   2. Add it as a secret pipeline variable named GITHUB_PAT in ADO:
  #      Pipelines → Edit → Variables → + Add → Name: GITHUB_PAT → 🔒 Keep secret
  #   3. Create the target repo on GitHub (e.g. github.com/chriser/opsatlas)
  #      before the first run (can be private or public).
  # ---------------------------------------------------------------------------
  - script: |
      set -euo pipefail
      git config user.email "pipeline@azure-devops"
      git config user.name "ADO Mirror"
      if [ -z "${GITHUB_PAT:-}" ]; then
        echo "GITHUB_PAT is not configured; skipping GitHub mirror."
        exit 0
      fi
      BRANCH="${BUILD_SOURCEBRANCH#refs/heads/}"
      git remote add github "https://x-access-token:${GITHUB_PAT}@github.com/chriser/opsatlas.git"
      git fetch --unshallow 2>/dev/null || true   # ensure full history on shallow clones
      git fetch github "refs/heads/${BRANCH}:refs/remotes/github/${BRANCH}" 2>/dev/null || true
      git push github "HEAD:refs/heads/${BRANCH}" --force-with-lease
    displayName: Mirror to GitHub
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/'))
    env:
      GITHUB_PAT: $(GITHUB_PAT)
