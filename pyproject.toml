[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["automation/azure_devops"]

[tool.ruff.lint]
# SLF001: no reaching into another module's private members (REF S59, docs/ways-of-working/Boundaries.md). Today's sites
# are marked line by line with "noqa: SLF001"; a new one fails the gate. The marks are an allow-list too: RUF100 fails a
# mark that no longer suppresses anything, and PGH004 a blanket "noqa" that would hide a new reach-in.
select = ["E", "F", "I", "W", "SLF001", "RUF100", "PGH004"]

[tool.ruff.lint.per-file-ignores]
# Tests may look inside what they test; Tibi's engine is its own component (its files are under its fingerprint and gate).
"tests/**" = ["SLF001", "RUF100"]
"evaluation/**" = ["SLF001"]
"services/sme_interviewer/**" = ["SLF001"]
